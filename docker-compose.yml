version: '3.8'

services:
  document-chat:
    build: .
    container_name: document-chat-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1